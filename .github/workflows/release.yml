name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The build script reads the tag with git describe, so the tags must
          # be present; the default depth of 1 leaves them out.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries for all platforms
        env:
          HB_SUNRISE_REQUIRE_VERSION: "1"
        run: ./scripts/build-hb-sunrise.sh dist

      - name: Verify the stamped version
        run: ./dist/hb-sunrise-linux-amd64 -version

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            wails-tags: -tags webkit2_41
          - os: windows-latest
            name: windows-amd64
            wails-tags: ""
          - os: macos-15-intel
            name: darwin-amd64
            wails-tags: ""
          - os: macos-latest
            name: darwin-arm64
            wails-tags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the frontend
        working-directory: desktop
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # The bindings generator compiles the app, and that compilation embeds
      # frontend/dist, so the frontend must be built first.
      - name: Build the desktop application
        working-directory: desktop
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 generate module
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 build ${{ matrix.wails-tags }} -skipbindings

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp desktop/build/bin/hb-sunrise dist/hb-sunrise-desktop-linux-amd64
          chmod +x dist/hb-sunrise-desktop-linux-amd64

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/bin/hb-sunrise.exe dist/hb-sunrise-desktop-windows-amd64.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent desktop/build/bin/hb-sunrise.app "dist/hb-sunrise-desktop-${{ matrix.name }}.zip"

      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - build
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries and desktop applications
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: (cd dist && sha256sum hb-sunrise-* > SHA256SUMS.txt)

      - name: Upload binaries and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
